name: Deploy to Cafe24 (SFTP)

on:
  push:
    branches: [ main ]

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: SFTP Deploy via lftp (upload only, never deletes remote files)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          success=0
          for attempt in 1 2 3 4 5; do
            echo "=== lftp sftp mirror attempt $attempt ==="
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 15
          set net:timeout 30
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 15
          set mirror:parallel-transfer-count 1
          set xfer:clobber yes
          set xfer:use-temp-file yes
          set xfer:temp-file-name '*.lftp-tmp-*'
          mirror --reverse --only-newer --no-perms --exclude-glob='.git*' --exclude='ftp-secret.txt' --exclude='README.md' --verbose ./ /hn1203000/www/
          EOF
            then
              success=1
              break
            fi
            echo "attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then
            echo "All 5 attempts failed"
            exit 1
          fi
